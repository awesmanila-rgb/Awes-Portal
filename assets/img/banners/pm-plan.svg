<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123F2B"/><stop offset=".6" stop-color="#1A6644"/><stop offset="1" stop-color="#23855A"/></linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4EFE8"/></linearGradient>
    <radialGradient id="glow" cx=".72" cy=".5" r=".45"><stop offset="0" stop-color="#7FE0B0" stop-opacity=".28"/><stop offset="1" stop-color="#7FE0B0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  <circle cx="1120" cy="90" r="170" fill="#FFFFFF" opacity=".05"/>
  <circle cx="660" cy="620" r="210" fill="#FFFFFF" opacity=".04"/>
  <!-- indoor split unit -->
  <g transform="translate(700 200)">
    <rect x="0" y="0" width="420" height="130" rx="26" fill="url(#unit)"/>
    <rect x="0" y="92" width="420" height="38" rx="0" fill="#D3E4DA"/>
    <rect x="0" y="92" width="420" height="38" rx="26" fill="#D3E4DA"/>
    <rect x="30" y="104" width="360" height="6" rx="3" fill="#A9C7B6"/>
    <rect x="30" y="116" width="360" height="4" rx="2" fill="#BDD5C7"/>
    <circle cx="380" cy="42" r="7" fill="#2FB36E"/>
    <rect x="30" y="34" width="120" height="14" rx="7" fill="#E1ECE5"/>
    <!-- airflow -->
    <g fill="none" stroke="#B9F0D4" stroke-width="7" stroke-linecap="round" opacity=".85">
      <path d="M70 170 q40 30 0 60 q-40 30 0 60"/>
      <path d="M170 170 q40 30 0 60 q-40 30 0 60"/>
      <path d="M270 170 q40 30 0 60 q-40 30 0 60"/>
      <path d="M370 170 q40 30 0 60 q-40 30 0 60"/>
    </g>
  </g>
  <!-- calendar check badge -->
  <g transform="translate(1030 150)">
    <circle cx="0" cy="0" r="64" fill="#FFFFFF"/>
    <rect x="-34" y="-30" width="68" height="62" rx="10" fill="none" stroke="#1F7A50" stroke-width="7"/>
    <path d="M-34 -10 h68" stroke="#1F7A50" stroke-width="7"/>
    <path d="M-18 -40 v18 M18 -40 v18" stroke="#1F7A50" stroke-width="7" stroke-linecap="round"/>
    <path d="M-15 12 l10 10 l22 -22" fill="none" stroke="#2FB36E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- sparkles -->
  <g fill="#FFFFFF" opacity=".7">
    <path d="M760 150 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6z"/>
    <path d="M1150 420 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4z"/>
  </g>
</svg>
